<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="praow-page" content="owner-login">
  <title>PRAOW · Owner</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/owner.css">
</head>
<body class="owner-body" data-owner-page="login">

  <main class="owner-login">
    <div class="login-card">
      <svg class="login-fan" viewBox="0 0 200 180" aria-hidden="true" fill="none">
        <line x1="40" y1="160" x2="160" y2="160" stroke="#C08A6B" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
        <line class="fan-ray" data-ray="0" x1="100" y1="160" x2="45" y2="160" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
        <line class="fan-ray" data-ray="1" x1="100" y1="160" x2="41.1" y2="135.6" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
        <line class="fan-ray" data-ray="2" x1="100" y1="160" x2="48.73" y2="108.73" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
        <line class="fan-ray" data-ray="3" x1="100" y1="160" x2="68.91" y2="84.93" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
        <line class="fan-ray" data-ray="4" x1="100" y1="160" x2="100" y2="70" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
        <line class="fan-ray" data-ray="5" x1="100" y1="160" x2="131.09" y2="84.93" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
        <line class="fan-ray" data-ray="6" x1="100" y1="160" x2="151.27" y2="108.73" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
        <line class="fan-ray" data-ray="7" x1="100" y1="160" x2="158.9" y2="135.6" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
        <line class="fan-ray" data-ray="8" x1="100" y1="160" x2="155" y2="160" stroke="#C08A6B" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <h1 class="login-title" data-i18n="own.title">PRAOW · Owner</h1>
      <p class="login-sub" data-i18n="own.login.sub">Clinic schedule · Thonglor</p>

      <form id="owner-login-form" autocomplete="on" action="/owner/dashboard" method="get">
        <div class="field">
          <label for="owner-email" data-i18n="own.email">Email</label>
          <input id="owner-email" name="email" type="email" value="owner@praow.demo" required enterkeyhint="next">
        </div>
        <div class="field">
          <label for="owner-pass" data-i18n="own.pass">Password</label>
          <input id="owner-pass" name="password" type="password" value="praowdemo" required enterkeyhint="go">
        </div>
        <button type="submit" class="btn" data-i18n="own.signin">เข้าสู่ระบบ / Sign in</button>
      </form>

      <span class="demo-pill" data-i18n="own.demo">เดโม่ · ข้อมูลจำลองทั้งหมด / Demo · all data simulated</span>
    </div>
  </main>

  <script src="../js/owner-data.js"></script>
  <script src="../js/owner.js"></script>
</body>
</html>
